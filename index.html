<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Main TTO</title>
<style>
:root{--bg:#f5f7fb;--panel:#111;--text:#fff;--muted:#cbd5e1;--green:#16a34a;--amber:#f59e0b;--red:#e11d48;--ink:#0f172a;--cell:#fff;--cellBorder:#d1d5db}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
h1{font-size:clamp(26px,4.5vw,34px);text-align:center;margin:16px 0 8px}
.ranges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:980px;margin:0 auto 14px;padding:0 16px}
.ranges button{padding:12px 16px;border-radius:14px;border:0;background:#eaeef5;color:#0b57d0;font-weight:800;font-size:18px;cursor:pointer}
.ranges button.active{background:#111;color:#fff}
.panel{max-width:980px;margin:10px auto;padding:22px;border-radius:22px;background:var(--panel);color:var(--text)}
.now{display:flex;flex-direction:column;align-items:center;gap:8px}
.now h2{margin:0;font-size:clamp(22px,4vw,28px);font-weight:900}
.big{font-size:clamp(64px,14vw,110px);font-weight:900;line-height:1}
.mrn{font-size:clamp(16px,3.3vw,20px);opacity:.85;min-height:1.2em}
.btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:18px;cursor:pointer}
.next{background:#16a34a;color:#fff}.noshow{background:var(--amber);color:#111}.reset{background:var(--red);color:#fff}
.giveWrap{margin-top:18px;text-align:center}
.give{background:#dc2626;color:#fff;min-width:230px}
.give:disabled{opacity:.55;cursor:not-allowed}
.giveHint{margin-top:7px;font-size:13px;color:#cbd5e1;font-weight:600;direction:rtl}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;max-width:980px;margin:14px auto 28px;padding:0 16px}
.cell{border:2px solid var(--cellBorder);border-radius:14px;padding:14px 0;text-align:center;font-weight:800;font-size:18px;background:var(--cell);cursor:pointer;user-select:none;transition:.15s}
.cell.on{background:#111;color:#fff;border-color:#000}.cell.no{background:#9ca3af;color:#fff;border-color:#888}.cell.printed{background:#16a34a;color:#fff;border-color:#0f7a34}
.tip{max-width:980px;margin:0 auto 22px;padding:0 16px;color:#475569;text-align:center}
#accessOverlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:9999;color:#fff;font-family:Segoe UI,Arial,sans-serif;padding:18px}
.accessBox{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,340px)}
.accessBox h2{margin:0 0 8px;font-size:28px}
.accessBox input,.accessBox select{padding:12px 18px;font-size:18px;border-radius:8px;border:none;width:100%;background:#fff;color:#111;text-align:center}
.accessBox label{font-size:17px;font-weight:700;align-self:stretch;text-align:center}
.accessBox button{padding:12px 20px;font-size:18px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;width:100%}
</style>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="accessOverlay">
  <div class="accessBox">
    <h2>Access Required</h2>
    <input id="pw" type="password" placeholder="Enter password" autocomplete="off" />
    <label for="counterSelect">Select Counter / اختر الشباك</label>
    <select id="counterSelect" required>
      <option value="" selected disabled>Choose Counter</option>
      <option value="1">Counter 1</option>
      <option value="2">Counter 2</option>
      <option value="3">Counter 3</option>
      <option value="4">Counter 4</option>
    </select>
    <button id="go" type="button">Continue</button>
  </div>
</div>
<h1>Main TTO</h1>
<div class="ranges" id="ranges"></div>
<div class="panel"><div class="now">
<h2>Now Serving</h2><div class="big" id="nowNum">-</div><div class="mrn" id="nowMrn"></div>
<div class="btns"><button class="btn next" id="btnNext">Next</button><button class="btn noshow" id="btnNo">No Show</button><button class="btn reset" id="btnReset">Restart</button></div>
<div class="giveWrap">
  <button class="btn give" id="btnGiveNext">Give Next Ticket</button>
  <div class="giveHint">اضغط عند إعطاء التذكرة الجديدة للعميل</div>
</div>
<div id="confirmationMsg" style="margin-top:12px;font-weight:800;color:#16a34a;font-size:18px;"></div>
</div></div>
<div id="grid" class="grid"></div>
<p class="tip">ضغطة أولى = أخضر، ضغطة ثانية = أسود، دبل كلك = رمادي.</p>
<script>
(function(){
const pass="kpcreg";
const overlay=document.getElementById("accessOverlay");
const pwEl=document.getElementById("pw");
const counterEl=document.getElementById("counterSelect");
const storedCounter=sessionStorage.getItem("mainTTOCounter");
if(sessionStorage.getItem("authOK")==="true" && /^[1-4]$/.test(storedCounter||"")){
  overlay.remove();
}
function submit(){
  if(pwEl.value.trim()!==pass){alert("Incorrect password.");return;}
  if(!/^[1-4]$/.test(counterEl.value)){alert("Please select Counter 1, 2, 3 or 4.");return;}
  sessionStorage.setItem("authOK","true");
  sessionStorage.setItem("mainTTOCounter",counterEl.value);
  overlay.remove();
}
document.getElementById("go").onclick=submit;
pwEl.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
counterEl.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
})();
</script>
<script>
(function(){
const cfg={apiKey:"AIzaSyCWWnMsge75Q3_MDF9Aj9wo4C5KD6RVGfw",authDomain:"q-matic-b7d77.firebaseapp.com",databaseURL:"https://q-matic-b7d77-default-rtdb.firebaseio.com",projectId:"q-matic-b7d77",storageBucket:"q-matic-b7d77.appspot.com",messagingSenderId:"908187704899",appId:"1:908187704899:web:b8bcf33cda90bafe81bef6"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.database(),ROOT="main_TTO";
const gridEl=document.getElementById("grid"),nowNum=document.getElementById("nowNum"),nowMrn=document.getElementById("nowMrn"),rangesEl=document.getElementById("ranges"),msgEl=document.getElementById("confirmationMsg");
function selectedCounter(){const c=Number(sessionStorage.getItem("mainTTOCounter"));if(!Number.isInteger(c)||c<1||c>4)throw new Error("Select a counter by logging in again.");return c;}
const ranges=[];for(let s=1;s<=1000;s+=100)ranges.push([s,s+99]);
ranges.forEach(([a,b],i)=>{const btn=document.createElement("button");btn.textContent=`${a}–${b}`;btn.onclick=()=>showRange(a,b,btn);rangesEl.appendChild(btn);if(i===0)btn.classList.add("active");});
function clearActive(){[...rangesEl.children].forEach(btn=>btn.classList.remove("active"));}
let served={},printed={},noshow={},curStart=1,curEnd=100;
db.ref(`${ROOT}/served`).on("value",snap=>{served=snap.val()||{};refreshGridClasses();});
db.ref(`${ROOT}/printed`).on("value",snap=>{printed=snap.val()||{};refreshGridClasses();});
db.ref(`${ROOT}/noshow`).on("value",snap=>{noshow=snap.val()||{};refreshGridClasses();});
function showRange(a,b,btn){clearActive();if(btn)btn.classList.add("active");curStart=a;curEnd=b;gridEl.innerHTML="";for(let n=a;n<=b;n++){const cell=document.createElement("div");cell.className="cell";cell.textContent=n;let clickTimer=null;cell.addEventListener("click",()=>{clearTimeout(clickTimer);clickTimer=setTimeout(()=>handleNumberClick(n),260);});cell.addEventListener("dblclick",async event=>{event.preventDefault();clearTimeout(clickTimer);await markAsNoShow(n);});gridEl.appendChild(cell);}refreshGridClasses();}
function refreshGridClasses(){[...gridEl.children].forEach(cell=>{const n=parseInt(cell.textContent,10);cell.classList.remove("on","no","printed");if(served[n])cell.classList.add("on");else if(noshow[n])cell.classList.add("no");else if(printed[n])cell.classList.add("printed");});}
async function handleNumberClick(n){if(noshow[n]||served[n])return;if(printed[n]){await serve(n);return;}await markAsPrinted(n);}
async function markAsPrinted(n){
  printed[n]=true;delete served[n];delete noshow[n];refreshGridClasses();
  try{
    await Promise.all([
      db.ref(`${ROOT}/printed/${n}`).set(true),
      db.ref(`${ROOT}/served/${n}`).remove(),
      db.ref(`${ROOT}/noshow/${n}`).remove(),
      db.ref(`${ROOT}/times/printed/${n}`).set(firebase.database.ServerValue.TIMESTAMP)
    ]);
    // Keep Give Next Ticket synchronized even if a number is activated manually.
    await db.ref(`${ROOT}/lastGivenTicket`).transaction(current=>{
      const cur=Number(current)||0;
      return n>cur?n:cur;
    });
  }catch(e){
    delete printed[n];refreshGridClasses();alert("Firebase error: "+(e?.message||e));
  }
}
async function markAsNoShow(n){noshow[n]=true;delete served[n];delete printed[n];refreshGridClasses();if(parseInt(nowNum.textContent,10)===n)nowMrn.textContent="";try{await Promise.all([db.ref(`${ROOT}/noshow/${n}`).set(true),db.ref(`${ROOT}/served/${n}`).remove(),db.ref(`${ROOT}/printed/${n}`).remove()]);}catch(e){alert("Firebase error: "+(e?.message||e));}}
async function getMrn(n){const snap=await db.ref(`${ROOT}/mrn/${n}`).get();return snap.exists()?snap.val():null;}
async function serve(n){if(noshow[n]){alert("❌ لا يمكن نداء تذكرة تم تسجيلها كـ No Show");return;}
let counter;try{counter=selectedCounter();}catch(e){alert(e.message);return;}
served[n]=true;delete printed[n];delete noshow[n];refreshGridClasses();let mrnVal=null;
try{
await Promise.all([db.ref(`${ROOT}/served/${n}`).set(true),db.ref(`${ROOT}/printed/${n}`).remove(),db.ref(`${ROOT}/noshow/${n}`).remove()]);
mrnVal=await getMrn(n);
await Promise.all([
 db.ref(`${ROOT}/times/served/${n}`).set(firebase.database.ServerValue.TIMESTAMP),
 db.ref(`${ROOT}/latest`).set({number:n,window:counter,windowNum:counter,ts:firebase.database.ServerValue.TIMESTAMP,mrn:mrnVal||null}),
 db.ref(`${ROOT}/calls/${n}`).set({number:n,window:counter,windowNum:counter,mrn:mrnVal||null,ts:firebase.database.ServerValue.TIMESTAMP}),
 db.ref(`${ROOT}/assignment/${n}/window`).set(counter)
]);
}catch(e){delete served[n];refreshGridClasses();alert("Firebase error: "+(e?.message||e));return;}
nowNum.textContent=n;nowMrn.textContent=mrnVal?`MRN: ${mrnVal}`:"";
if(n===curEnd&&curEnd<1000){const nextStart=curEnd+1,nextEnd=Math.min(curEnd+100,1000),nextBtn=[...rangesEl.children][Math.floor((nextStart-1)/100)];showRange(nextStart,nextEnd,nextBtn);}
}
async function claimNextTicket(start,end){for(let n=start;n<=end;n++){if(noshow[n])continue;const ref=db.ref(`${ROOT}/served/${n}`);const result=await ref.transaction(current=>{if(current===true)return;return true;});if(result.committed){await Promise.all([db.ref(`${ROOT}/noshow/${n}`).remove(),db.ref(`${ROOT}/printed/${n}`).remove()]);return n;}}return null;}

function highestUsedTicket(){
  let max=0;
  for(const source of [printed,served,noshow]){
    Object.keys(source||{}).forEach(k=>{
      if(source[k]){const n=Number(k);if(Number.isInteger(n)&&n>max)max=n;}
    });
  }
  return max;
}

async function giveNextTicket(){
  const btn=document.getElementById("btnGiveNext");
  btn.disabled=true;
  try{
    const fallback=highestUsedTicket();
    const ref=db.ref(`${ROOT}/lastGivenTicket`);
    const result=await ref.transaction(current=>{
      const cur=Number(current);
      const last=Number.isInteger(cur)&&cur>=0?cur:fallback;
      if(last>=1000)return;
      return last+1;
    });

    if(!result.committed){
      alert("لا توجد تذاكر جديدة متاحة. وصلنا إلى 1000.");
      return;
    }

    const n=Number(result.snapshot.val());
    if(!(n>=1&&n<=1000)){
      alert("تعذر تحديد رقم التذكرة التالية.");
      return;
    }

    await markAsPrinted(n);

    const start=Math.floor((n-1)/100)*100+1;
    const end=Math.min(start+99,1000);
    const rangeBtn=[...rangesEl.children][Math.floor((n-1)/100)];
    showRange(start,end,rangeBtn);

    msgEl.style.color="#16a34a";
    msgEl.textContent=`✅ تم إعطاء التذكرة رقم ${n}`;
    setTimeout(()=>{if(msgEl.textContent.includes(String(n)))msgEl.textContent="";},3500);
  }catch(e){
    alert("Firebase error: "+(e?.message||e));
  }finally{
    btn.disabled=false;
  }
}

document.getElementById("btnGiveNext").onclick=giveNextTicket;

document.getElementById("btnNext").onclick=async()=>{try{selectedCounter();const n=await claimNextTicket(curStart,curEnd);if(n!==null)await serve(n);else{msgEl.textContent="⚠️ تم أخذ التذكرة من شباك آخر";setTimeout(()=>msgEl.textContent="",4000);}}catch(e){alert(e.message||e);}};
document.getElementById("btnNo").onclick=async()=>{const n=parseInt(nowNum.textContent,10);if(n)await markAsNoShow(n);};
document.getElementById("btnReset").onclick=async()=>{if(!confirm("سيتم مسح جميع البيانات (مطبوع/مخدّم/لم يحضر) وإعادة البدء. متابعة؟"))return;try{await Promise.all([db.ref(`${ROOT}/served`).remove(),db.ref(`${ROOT}/noshow`).remove(),db.ref(`${ROOT}/printed`).remove(),db.ref(`${ROOT}/mrn`).remove(),db.ref(`${ROOT}/latest`).remove(),db.ref(`${ROOT}/latestPrinted`).remove(),db.ref(`${ROOT}/next`).set(null),db.ref(`${ROOT}/lastGivenTicket`).remove(),db.ref(`${ROOT}/assignment`).remove(),db.ref(`${ROOT}/calls`).remove()]);const flagRef=db.ref(`${ROOT}/resetFlag`);await flagRef.set(Date.now());setTimeout(()=>flagRef.set(null),1500);served={};noshow={};printed={};nowNum.textContent="-";nowMrn.textContent="";refreshGridClasses();const firstBtn=document.querySelector(".ranges button");if(firstBtn)showRange(1,100,firstBtn);}catch(e){alert("Firebase error: "+(e?.message||e));}};
db.ref(`${ROOT}/latest`).on("value",snap=>{const v=snap.val();if(!v)return;nowNum.textContent=v.number||"-";nowMrn.textContent=v.mrn?`MRN: ${v.mrn}`:"";});
showRange(1,100,rangesEl.firstElementChild);
})();
</script>
</body>
</html>
